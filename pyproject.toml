readme = "README.md"
authors = [
    { name = "bingquan li", email = "bingquantum@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fiftyone>=1.22.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
